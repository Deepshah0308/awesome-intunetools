name: Build site and README

on:
  push:
    branches: [main]
    paths:
      - 'data/tools.json'
      - 'scripts/build.py'
      - 'docs/style.css'
      - 'docs/app.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate README and website
        run: python scripts/build.py

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git diff --staged --quiet || git commit -m "Rebuild site and README from tools.json"
          git push
