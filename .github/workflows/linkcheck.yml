name: Check tool links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify every tool URL resolves
        id: check
        run: python scripts/linkcheck.py

      # The site states this run as its quality claim, so publish the result
      # whether or not a link broke. Rebuilding here rather than relying on a
      # push trigger: commits made with GITHUB_TOKEN do not start workflows.
      - name: Publish the result
        if: always()
        run: |
          python scripts/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkcheck.json README.md docs
          git diff --quiet --cached && exit 0
          git commit -m "Record weekly link check"
          git push
